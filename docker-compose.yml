services:
  web:
    build: .
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
      - media:/app/media
    environment:
      - DEBUG=0
      - SECRET_KEY=prod-secret-key
      - ALLOWED_HOSTS=yourdomain.com,www.yourdomain.com
      - CSRF_TRUSTED_ORIGINS=https://yourdomain.com,https://www.yourdomain.com
      - DATABASE_URL=postgres://horilla_user:horilla_pass@db:5432/horilla_db
      - REDIS_URL=redis://:horilla_pass@redis:6379/0
    depends_on:
      - db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.horilla.rule=Host(`yourdomain.com`,`www.yourdomain.com`)"
      - "traefik.http.routers.horilla.entrypoints=websecure"
      - "traefik.http.routers.horilla.tls=true"
      - "traefik.http.services.horilla.loadbalancer.server.port=8000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horilla_db
      POSTGRES_USER: horilla_user
      POSTGRES_PASSWORD: horilla_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass horilla_pass
    volumes:
      - redis_data:/data

volumes:
  staticfiles:
  media:
  postgres_data:
  redis_data:
